<body>
<div class="app" id="app"></div>
<div class="mini-player" id="miniPlayer" style="display:none">
  <button class="mini-player-open" id="miniPlayerOpenBtn" type="button" aria-label="Training öffnen">
    <span class="mini-player-arrow" id="miniPlayerArrow"></span>
    <span class="mini-player-mid">
      <span class="mini-player-time" id="miniPlayerTime">00:00</span>
      <span class="mini-player-exercise" id="miniPlayerExercise"></span>
    </span>
  </button>
  <button class="mini-player-cancel" id="miniPlayerCancelBtn" type="button" aria-label="Training abbrechen">✕</button>
</div>

<!--
  Ausgelagerte JS-Module (ehemals ein einziges <script>, Zeilen 2020–15826 der Originaldatei).
  Es sind bewusst klassische, nicht-modulare <script>-Tags (kein type="module"):
  Der Originalcode teilt sich einen einzigen globalen Scope, in dem Funktionen und
  Variablen aus früheren Dateien von späteren Dateien direkt verwendet werden.
  Die Ladereihenfolge unten entspricht exakt der Reihenfolge im Originalskript

<!--
  NEU (nicht im Original enthalten): Service-Worker-Registrierung.
  Die App verlinkte bisher nur ein Manifest, hatte aber keinen Service Worker,
  war also installierbar, aber nicht offlinefähig. sw.js ergänzt das.
  Registrierung erfolgt mit relativem Pfad ("sw.js", nicht "/sw.js"),
  damit es auch unter einem GitHub-Pages-Projektpfad (z. B. /reponame/) funktioniert.
-->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((err) => {
      console.error('Service Worker Registrierung fehlgeschlagen:', err);
    });
  });
}
</script>
</body>
