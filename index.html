-->

<!--
  NEU (nicht im Original enthalten): Service-Worker-Registrierung.
  Die App verlinkte bisher nur ein Manifest, hatte aber keinen Service Worker,
  war also installierbar, aber nicht offlinefähig. sw.js ergänzt das.
  Registrierung erfolgt mit relativem Pfad ("sw.js", nicht "/sw.js"),
  damit es auch unter einem GitHub-Pages-Projektpfad (z. B. /reponame/) funktioniert.

  Zusätzlich: Update-Erkennung über den "updatefound"-Event der Registrierung. Wichtig ist
  die hadControllerBefore-Prüfung — ohne sie würde auch der ganz normale ERSTBESUCH (bei dem
  ja ebenfalls ein Service Worker neu installiert wird) fälschlich als "Update verfügbar"
  gemeldet, obwohl es beim ersten Laden nichts Neues zu holen gibt.
-->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const hadControllerBefore = !!navigator.serviceWorker.controller;

    navigator.serviceWorker.register('sw.js').then((registration) => {
      registration.addEventListener('updatefound', () => {
        const newWorker = registration.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && hadControllerBefore) {
            const toast = document.getElementById('updateToast');
            const btn = document.getElementById('updateToastBtn');
            if (!toast || !btn) return;
            toast.style.display = 'flex';
            btn.onclick = () => location.reload();
          }
        });
      });
    }).catch((err) => {
      console.error('Service Worker Registrierung fehlgeschlagen:', err);
    });
  });
}
</script>
