<!-- Statischer Erst-Wert für den Moment vor dem ersten JS-Paint (bestmögliche Annäherung).
     Sobald applyTheme() läuft (02-state-theme.js), setzt syncStatusBarColor() diesen Wert auf
     die tatsächlich in der App aktive Hintergrundfarbe — das deckt sowohl eine eigene
     Hintergrundfarbe als auch einen manuellen Light/Dark-Wechsel ab, der vom OS-Farbschema
     abweicht.
     BEWUSST NUR EIN Tag OHNE media-Attribut (früher zwei, gefiltert per
     media="(prefers-color-scheme: dark/light)"): Chrome wertet nachträgliche Änderungen am
     content-Attribut eines MEDIA-GEFILTERTEN theme-color-Tags unzuverlässig neu aus. In der
     installierten PWA blieb die untere Android-Geste-Navigationsleiste dadurch auf dem Wert
     hängen, der beim Start aktiv war (im Fehlerbericht: #0F131C "Blaugrau" aus der eigenen
     Hintergrundfarben-Palette — also nicht ein Systemfallback, sondern ein veralteter Wert von
     uns, was zeigt dass Chrome das Tag prinzipiell liest). Ein einzelnes ungefiltertes Tag ist
     der von Chrome gut unterstützte Fall für dynamische Änderungen; da wir den Wert ohnehin
     immer selbst aus dem aktiven Theme setzen, brauchen wir die media-Unterscheidung nicht. -->
<meta name="theme-color" id="metaThemeColor" content="#121316">
<!-- color-scheme teilt dem Browser mit, ob die Seite hell oder dunkel ist (es setzt KEINE
     konkrete Farbe — das macht allein theme-color oben). Wichtig für die untere Android-Geste-
     Navigationsleiste in der INSTALLIERTEN PWA: ohne dieses Signal färbt sie sich nicht mit den
     App-Themes mit.
     HISTORIE (bitte nicht erneut entfernen, ohne die Nebenwirkung zu prüfen): war kurzzeitig
     wieder ausgebaut, weil es einen hellen ~3px-Trennstrich zwischen System-Statusleiste und
     App-Inhalt OBEN verursachte. Nach dem Ausbau färbte sich die untere Leiste aber nicht mehr
     mit — d. h. dieses Tag ist tatsächlich das, was die untere Leiste einfärbt. Damit ist es ein
     bewusster Tausch: mitgefärbte untere Leiste (gewollt) gegen einen dünnen Strich oben
     (kosmetisch). Der Strich wird in Kauf genommen. -->
<meta name="color-scheme" content="dark light">

<!--
  Hinweis-Leiste, sobald ein neuer Service Worker im Hintergrund installiert wurde.
  "Aktualisieren" startet runHardUpdate() (04-utils.js): Backup-Download, Service Worker
  abmelden, Cache Storage leeren, App-Shell am HTTP-Cache vorbei neu ziehen, neu laden.
  Ein reines location.reload() genügt hier NICHT — der Browser-HTTP-Cache (GitHub Pages
  liefert max-age-Header) würde JS/CSS sonst weiterhin aus dem alten Stand bedienen.
  Bewusst kein automatischer Ablauf: würde sonst mitten in einem laufenden Training den
  Bildschirm wegreißen, siehe 11a-active-session.js.
-->
<div class="update-toast" id="updateToast" style="display:none">
  <span class="update-toast-text">Neue Version verfügbar.</span>

<!--
  Service-Worker-Registrierung mit relativem Pfad ("sw.js", nicht "/sw.js"), damit es auch
  unter einem GitHub-Pages-Projektpfad (z. B. /reponame/) funktioniert.

  Update-Erkennung: hängt an "updatefound" PLUS einer Prüfung auf registration.waiting
  (ein bereits installierter, wartender Worker feuert "updatefound" nicht mehr — ohne diese
  Prüfung bliebe das Banner nach einem Tab-Wechsel unsichtbar). Zusätzlich alle 30 Minuten
  und bei jedem Zurückholen in den Vordergrund ein registration.update().

  WICHTIG: Der Browser erkennt ein Update nur, wenn sich sw.js selbst BYTEWEISE ändert.
  Deshalb muss CACHE_NAME in sw.js bei jedem Deploy hochgezählt werden — sonst erscheint
  das Banner nie, egal wie viel sich an js/ oder css/ geändert hat.

  hadControllerBefore verhindert, dass der ganz normale Erstbesuch (bei dem ebenfalls ein
  Worker neu installiert wird) fälschlich als "Update verfügbar" gemeldet wird.
-->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const hadControllerBefore = !!navigator.serviceWorker.controller;

    function showUpdateToast() {
      const toast = document.getElementById('updateToast');
      const btn = document.getElementById('updateToastBtn');
      if (!toast || !btn || toast.style.display === 'flex') return;
      toast.style.display = 'flex';
      btn.onclick = () => runHardUpdate();
    }

    navigator.serviceWorker.register('sw.js').then((registration) => {
      if (registration.waiting && hadControllerBefore) showUpdateToast();

      registration.addEventListener('updatefound', () => {
        const newWorker = registration.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && hadControllerBefore) showUpdateToast();
        });
      });

      setInterval(() => registration.update().catch(() => {}), 30 * 60 * 1000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) registration.update().catch(() => {});
      });
    }).catch((err) => {
      console.error('Service Worker Registrierung fehlgeschlagen:', err);
    });
  });
}
</script>
